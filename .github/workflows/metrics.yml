name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # No push trigger. This action takes about 16 minutes per run, and the
  # metrics it renders are daily aggregates that a commit does not change,
  # so firing on every push spent a quarter hour of runner time to redraw
  # the same image.

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # The stored METRICS_TOKEN is a classic PAT that expired, and an
          # expired secret is still non-empty, so it cannot be fallen back
          # from with ||. The built-in token reads everything this profile
          # renders, since all of it is public.
          token: ${{ secrets.GITHUB_TOKEN }}
          user: aryanputta
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          config_padding: 0, 8 + 11%

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: X

          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200

          filename: github/metrics.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
