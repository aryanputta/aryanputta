name: Merged PR stats

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: pr-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recount merged pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_pr_stats.py

      - name: Commit if the counts moved
        run: |
          git config user.name "aryanputta-stats-bot"
          git config user.email "aryanputta-stats-bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh merged pull request counts"
          git push
