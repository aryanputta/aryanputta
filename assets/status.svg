<svg width="830" height="54" viewBox="0 0 830 54" xmlns="http://www.w3.org/2000/svg">
<rect width="830" height="54" fill="#0d1117"/>
<line x1="28" y1="1" x2="802" y2="1" stroke="#1e1c14" stroke-width="1"/>

<!-- Left dot -->
<circle cx="36" cy="27" r="3" fill="#C9AA71" opacity="0.6"/>

<!-- Status text -->
<text font-family="'Courier New',Courier,monospace" font-size="11" fill="#6a6050">
  <tspan x="52" y="31"><tspan fill="#C9AA71">status</tspan>   building</tspan>
</text>

<!-- Separator -->
<line x1="200" y1="14" x2="200" y2="40" stroke="#1e1c14" stroke-width="1"/>

<!-- Open to text -->
<text font-family="'Courier New',Courier,monospace" font-size="11" fill="#6a6050">
  <tspan x="214" y="31"><tspan fill="#C9AA71">open to</tspan>  research &amp; roles</tspan>
</text>

<!-- Separator -->
<line x1="430" y1="14" x2="430" y2="40" stroke="#1e1c14" stroke-width="1"/>

<!-- Lap delta -->
<text font-family="'Courier New',Courier,monospace" font-size="11" fill="#6a6050">
  <tspan x="444" y="31"><tspan fill="#C9AA71">lap Δ</tspan>    −0.3s</tspan>
</text>

<!-- Separator -->
<line x1="580" y1="14" x2="580" y2="40" stroke="#1e1c14" stroke-width="1"/>

<!-- Right side: NYC -->
<text font-family="'Courier New',Courier,monospace" font-size="11" fill="#6a6050">
  <tspan x="594" y="31"><tspan fill="#C9AA71">loc</tspan>      new york city</tspan>
</text>

<!-- Right dot -->
<circle cx="794" cy="27" r="3" fill="#C9AA71" opacity="0.6">
  <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
</circle>

<line x1="28" y1="53" x2="802" y2="53" stroke="#1e1c14" stroke-width="1"/>
</svg>
